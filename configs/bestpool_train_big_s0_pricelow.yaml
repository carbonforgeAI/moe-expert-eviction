seed: 0
model:
  id: allenai/OLMoE-1B-7B-0125
  revision: 9b0c1aa87e34a20052389dce1f0cf01da783f654
  dtype: bfloat16
  device: cuda
train:
  # tau-priced objective (E12): identical to bestpool_train_big_s0 except the cost terms.
  # Charge bytes at measured prices: in best_of_pool the 'switch' term is beta * soft set
  # difference = expected experts moved, so its lambda IS the per-expert price. Shipped heads
  # used 0.05 (implicit e = 0.098 nats/ms); these arms price at measured-frontier slopes. Arm pricelow: e = 0.005. Everything else matched to the shipped heads.
  prompt_dataset:
    path: teknium/OpenHermes-2.5
    split: train
    streaming: true
    shuffle: true
    seed: 0
    shuffle_buffer_size: 8192
    max_records: 256
    conversation_field: conversations
    content_field: value
  max_sequences: 256
  batch_size: 4
  reference_batch_size: 4
  max_length: 384
  steps: 220
  learning_rate: 1.0e-3
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  objective: differentiable_cache
  expert_cost_profile: uniform
  lambda_switch: 0.00255   # = e * tau: e = 0.005 nats per ms/token, tau = 0.51 ms/expert (measured); in best_of_pool the switch term counts experts moved
  lambda_commit: 0.02
  lambda_mu_coverage: 1.0
  lambda_deliberation: 0.0
  lambda_load: 0.0   # stub in best_of_pool mode; traffic is priced via lambda_switch
  cache_capacity: 32
  initial_router_state: ${MOE_ROOT}/runs/remoe-openhermes-384train-1024-20260620-224832/remoe_train/router_state.pt
  controller:
    mechanism: best_of_pool
    train_router: false
    continuation_weighting: restricted_softmax
    state_update_threshold: 0.5
    coverage_target: current
    restrict_layers: [4, 5, 6, 7, 8, 11, 12, 13]
    beta_head:
      hidden_dim: 128
      shared_across_layers: true
      feature_mode: henderson
    policy_head:
      hidden_dim: 64
      shared_across_layers: false
    lambda_router: 0.01
output_dir: outputs/bestpool_train_big_s0_pricelow
