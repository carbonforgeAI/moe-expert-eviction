# Smoke config: 2 sequences, short dwell sweep. Should finish in ~10 min on an L40S and
# trip the built-in cross-checks (lru == resident_gpu NLL; dwell_1 == resident_gpu NLL).
seed: 0
model:
  id: allenai/OLMoE-1B-7B-0125
  revision: 9b0c1aa87e34a20052389dce1f0cf01da783f654
  dtype: bfloat16
  device: cuda
eval:
  prompt_dataset:
    path: teknium/OpenHermes-2.5
    split: train
    streaming: true
    shuffle: true
    seed: 0
    shuffle_buffer_size: 8192
    skip_records: 2080
    max_records: 4
    conversation_field: conversations
    content_field: value
  max_sequences: 2
  max_length: 384
  capacity: 32
  restrict_layers: [4, 5, 6, 7, 8, 11, 12, 13]
  policies: [resident_gpu, lru, dwell]
  dwells: [1, 8]
  timing_warmup_steps: 32
output_dir: outputs/offload_wallclock_smoke
